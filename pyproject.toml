[project]
name = "vid-s-clone-api"
version = "1.0.0"
description = "FastAPI Gateway for Vid's Clone"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "asyncpg>=0.30,<1",
    "pyjwt>=2.10,<3",
    "passlib[bcrypt]>=1.7,<2",
    "structlog>=25.0,<26",
    "prometheus-client>=0.21,<1",
    "slowapi>=0.1,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "langgraph>=0.4,<1",
    "langchain-core>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    "respx>=0.22,<1",
    "httpx>=0.28,<1",
]