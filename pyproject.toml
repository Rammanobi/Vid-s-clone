[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-s-clone-api"
version = "1.0.0"
description = "FastAPI Gateway for Vid's Clone"
# Floor is 3.11 (no 3.12-only syntax is used anywhere); Docker and CI target 3.12.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "asyncpg>=0.30,<1",
    "pyjwt>=2.10,<3",
    "passlib[bcrypt]>=1.7,<2",
    "structlog>=25.0,<26",
    "prometheus-client>=0.21,<1",
    "slowapi>=0.1,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "langgraph>=0.4,<1",
    # No upper bound: langchain>=1.0 (below) actually needs a newer
    # langchain-core than <1 allows - a hard <1 ceiling here made pip's
    # resolver declare the two mutually unsatisfiable on a clean install,
    # even though the locally-installed pair (1.3.13 / 0.3.86, kept working
    # via the app/graph/graph.py compat shim for langchain.debug/.verbose)
    # is fine in practice. Let pip pick a compatible pair itself.
    "langchain-core>=0.3",
    "redis>=5.2,<6",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=3.0,<4",
    # Everything below was missing from this list and only worked locally
    # because it happened to already be installed in the dev venv -
    # discovered when the first clean Docker build crashed at import time.
    "python-dateutil>=2.9,<3",
    # FastAPI's Form(...) parameters (used by /auth/token) raise this at
    # request time, not import time - never surfaced until an actual login
    # attempt hit the container.
    "python-multipart>=0.0.9,<1",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    # <1, not >=1.0: langchain>=1.0 requires langgraph>=1.0, but this whole
    # app was built and verified all session against langgraph 0.6.11 (the
    # langgraph>=0.4,<1 pin above) - upgrading langgraph to 1.x to satisfy a
    # newer langchain is untested and out of scope here. Below 1.0, langchain
    # still ships .debug/.verbose natively, so the compat shim in
    # app/graph/graph.py just becomes a harmless no-op instead of a real fix.
    "langchain>=0.3,<1",
    "faster-whisper>=1.0,<2",
]

[tool.setuptools.packages.find]
# Flat layout with several non-package top-level dirs (frontend, prisma, infra,
# grafana, prometheus, openspec). Without this, setuptools auto-discovery aborts.
include = ["app*", "hiker_ingestion*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    "respx>=0.22,<1",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.13,<2",
]

[tool.ruff.lint]
# Pinned explicitly: with no [tool.ruff] config, ruff's own default rule
# set differs sharply by version (a few hundred checks on 0.11.x vs ~788
# on 0.16.x) - CI resolving a newer ruff than a dev's local install caused
# lint to pass locally and fail in CI on rule categories (bandit, pylint,
# simplify, async, pyupgrade, isort) nobody had opted into. This pins the
# actual enforced set to match what the codebase has been written against.
select = ["E4", "E7", "E9", "F"]